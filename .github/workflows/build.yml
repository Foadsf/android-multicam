name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed only by the publish step on the default branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK & NDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" > /dev/null

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify zero network permission
        run: |
          perms=$("$ANDROID_HOME/build-tools/37.0.0/aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk)
          echo "$perms"
          ! echo "$perms" | grep -q 'android.permission.INTERNET'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Runs only for commits that land on the default branch (e.g. a merged PR):
      # publishes the freshly built APK as a rolling "latest" GitHub release.
      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "multicam-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk multicam-latest.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (${short})" \
            --notes "Automatic debug-signed build of ${GITHUB_SHA} from ${GITHUB_REF_NAME}. Sideload it, or: adb install -r -g multicam-latest.apk" \
            "multicam-${short}.apk" multicam-latest.apk
